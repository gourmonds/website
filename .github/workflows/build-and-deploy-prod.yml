name: Build and deploy to prod

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout respository
      uses: actions/checkout@v7
    
    - name: Setup Node.js environment
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # eleventy-img skips images it has already generated: without this cache,
    # every deploy re-encodes all images (several minutes instead of seconds)
    - name: Cache optimized images
      uses: actions/cache@v4
      with:
        path: build/img
        key: images-${{ hashFiles('src/assets/images/**', '11ty/configuration.js') }}
        restore-keys: images-

    - name: Build static website
      run: npm run build:prod
    
    - name: Deploy with rsync
      uses: up9cloud/action-rsync@master
      env:
        HOST: w00e57f7.kasserver.com
        USER: ssh-w018eeb1
        KEY: ${{secrets.DEPLOY_SSH_KEY}}
        SOURCE: ./build/
        TARGET: /www/htdocs/w018eeb1/www.gourmonds.de/www
